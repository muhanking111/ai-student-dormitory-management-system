spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:dormitory-dev;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  sql:
    init:
      mode: always

sa-token:
  cookie:
    secure: false

dormitory:
  demo-data-enabled: true
  security:
    require-login-origin: false
  auth:
    rate-limit:
      enabled: false
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174
