spring:
  ai:
    model:
      chat: openai
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    openai:
      base-url: ${DEEPSEEK_BASE_URL:${SPRING_AI_OPENAI_BASE_URL:https://api.deepseek.com}}
      api-key: ${DEEPSEEK_API_KEY:${SPRING_AI_OPENAI_API_KEY}}
      chat:
        options:
          model: ${DEEPSEEK_CHAT_MODEL:${SPRING_AI_OPENAI_CHAT_MODEL:deepseek-v4-flash}}
          internal-tool-execution-enabled: false
    retry:
      max-attempts: 1

dormitory:
  security:
    require-login-origin: false
  auth:
    rate-limit:
      enabled: false
  ai:
    enabled: true
    provider:
      active: spring-ai
      model-alias: ${DEEPSEEK_CHAT_MODEL:${SPRING_AI_OPENAI_CHAT_MODEL:deepseek-v4-flash}}
    capabilities:
      assistant: true
    streaming:
      enabled: true
    audit:
      hmac-key: real-contract-audit-hmac-key-not-a-secret-2026
    tokenization:
      hmac-key: real-contract-tokenization-key-not-a-secret-2026
    step-up:
      hmac-key: real-contract-step-up-hmac-key-not-a-secret-2026
    budget:
      reserved-cost: ${AI_RUN_RESERVED_COST:10}
